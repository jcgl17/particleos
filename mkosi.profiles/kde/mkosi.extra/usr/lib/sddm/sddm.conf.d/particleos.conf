[General]
Numlock=on
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Theme]
Current=breeze

[Users]
# At the very least, this seems to not be set to 60513 in Fedora 42;
# I needed to set it before my homed-managed user would show up
MaximumUid=60513

[Wayland]
CompositorCommand=kwin_wayland --no-global-shortcuts --no-lockscreen --locale1
